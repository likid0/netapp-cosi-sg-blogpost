# access.yaml  (developer, in their own namespace)
#
# Requests an identity that can use the bucket. Names the claims it covers,
# the access mode for each, and the Secret that will receive the credentials.
# When ready, the Secret `my-bucket-creds` holds the connection details under
# COSI's own field names (COSI_S3_ENDPOINT, COSI_S3_ACCESS_KEY_ID, etc.).
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: my-bucket-access
  namespace: cosi-test
spec:
  bucketAccessClassName: sg-access-class
  protocol: S3
  bucketClaims:
    - bucketClaimName: my-first-bucket
      accessMode: ReadWrite
      accessSecretName: my-bucket-creds
